<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Tifusi Panel core traffic flow and tunnel map, animated">
  <style>
    text { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace; }
    .muted { fill: #8b8b8b; }
    .faint { fill: #5c5c5c; }
    .blk { fill: #0e0e0e; stroke: #2a2a2a; }
    .run { fill: none; stroke: #f97316; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 10 16; animation: run 1.2s linear infinite; }
    .run.block { stroke: #ef4444; opacity: .7; }
    .run.quiet { stroke: #555; animation-duration: 3s; }
    @keyframes run { to { stroke-dashoffset: -26; } }
    .base { fill: none; stroke: #262626; stroke-width: 1.5; }
    .beam { fill: none; stroke: url(#beamGrad); stroke-width: 2.6; stroke-linecap: round; stroke-dasharray: 70 520; animation: beam 2.8s linear infinite; }
    .beam.slow { animation-duration: 3.6s; animation-delay: -1.2s; }
    @keyframes beam { from { stroke-dashoffset: 590; } to { stroke-dashoffset: 0; } }
    .cut { fill: none; stroke: #ef4444; stroke-width: 1.6; stroke-dasharray: 4 7; opacity: .6; }
    .sonar { transform-box: fill-box; transform-origin: center; animation: sonar 3s ease-out infinite; }
    @keyframes sonar { from { transform: scale(.4); opacity: .7; } to { transform: scale(2.4); opacity: 0; } }
    .orbit { animation: spin 9s linear infinite; }
    .orbit.rev { animation-direction: reverse; animation-duration: 12s; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .blink { animation: blink 1.4s steps(2, jump-none) infinite; }
    @keyframes blink { 50% { opacity: .25; } }
  </style>
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.06"/></pattern>
    <linearGradient id="beamGrad" x1="0" x2="1"><stop offset="0" stop-color="#f97316" stop-opacity="0"/><stop offset=".6" stop-color="#f97316"/><stop offset="1" stop-color="#fde68a"/></linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="1279" height="719" rx="22" fill="#0a0a0a" stroke="#232323"/>
  <g transform="translate(24 22)">
    <circle cx="6" cy="6" r="6" fill="#2a2a2a"/><circle cx="26" cy="6" r="6" fill="#2a2a2a"/><circle cx="46" cy="6" r="6" fill="#2a2a2a"/>
    <text x="72" y="11" font-size="13" class="muted">Tifusi Panel · live</text>
    <circle cx="1216" cy="6" r="4" fill="#22c55e"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="1226" y="10" font-size="11" fill="#22c55e">LIVE</text>
  </g>
  <line x1="0" y1="52" x2="1280" y2="52" stroke="#191919"/>

  <!-- ═══ CORES ═══ -->
  <text x="32" y="86" font-size="12" letter-spacing="3" fill="#f97316">CORES</text>
  <text x="32" y="114" font-size="22" font-weight="600" fill="#f5f5f5">Xray traffic flow</text>
  <text x="32" y="138" font-size="12" class="muted">Read straight from the core's JSON · first matching rule wins</text>

  <g transform="translate(32 156)">
    <rect width="592" height="542" rx="20" fill="#141414" stroke="#232323"/>
    <g font-size="11">
      <rect x="18" y="16" width="150" height="26" rx="9" fill="#0e0e0e" stroke="#2a2a2a"/><text x="30" y="33" fill="#f5f5f5">XRAY · Reality</text>
      <rect x="178" y="16" width="96" height="26" rx="9" fill="rgb(34,197,94)" fill-opacity=".06" stroke="rgb(34,197,94)" stroke-opacity=".35"/><text x="190" y="33" fill="#22c55e">✓ Valid JSON</text>
      <circle cx="300" cy="29" r="4" fill="#22c55e"/><text x="310" y="33" class="muted">germany</text>
      <circle cx="372" cy="29" r="4" fill="#22c55e"/><text x="382" y="33" class="muted">helsinki</text>
    </g>
    <g font-size="10" class="faint"><text x="18" y="76">INBOUNDS</text><text x="210" y="76">ROUTING RULES</text><text x="440" y="76">OUTBOUNDS</text></g>
  </g>

  <!-- beams (absolute coords) -->
  <g>
    <path class="base" d="M200 290 C240 290 240 300 242 300"/><path class="run" d="M200 290 C240 290 240 300 242 300"/>
    <path class="base" d="M200 380 C240 380 240 330 242 330"/><path class="run" d="M200 380 C240 380 240 330 242 330" style="animation-duration:1.5s"/>
    <path class="base" d="M200 470 C236 470 236 262 242 262"/><path class="run quiet" d="M200 470 C236 470 236 262 242 262"/>
    <path class="base" d="M438 262 C466 262 466 560 474 560"/><path class="run quiet" d="M438 262 C466 262 466 560 474 560"/>
    <path class="base" d="M438 322 C466 322 466 440 474 440"/><path class="run block" d="M438 322 C466 322 466 440 474 440"/>
    <path class="base" d="M438 382 C466 382 466 440 474 440"/><path class="run block" d="M438 382 C466 382 466 440 474 440" style="animation-duration:1.6s"/>
    <path class="base" d="M438 442 C460 442 460 320 474 320"/><path class="run" d="M438 442 C460 442 460 320 474 320"/>
    <path class="base" d="M438 502 C460 502 460 320 474 320"/><path class="run" d="M438 502 C460 502 460 320 474 320" style="animation-duration:1.4s"/>
  </g>

  <g font-size="11">
    <g transform="translate(50 258)"><rect class="blk" width="150" height="62" rx="14"/><text x="12" y="24" class="mono" fill="#f5f5f5">vless-reality</text><text x="12" y="46" class="muted">VLESS · REALITY · :8443</text></g>
    <g transform="translate(50 348)"><rect class="blk" width="150" height="62" rx="14"/><text x="12" y="24" class="mono" fill="#f5f5f5">trojan-ws</text><text x="12" y="46" class="muted">Trojan · TLS · :443</text></g>
    <g transform="translate(50 438)" opacity=".6"><rect class="blk" width="150" height="62" rx="14"/><text x="12" y="24" class="mono" fill="#f5f5f5">api</text><text x="12" y="46" class="muted">Internal · stats :10085</text></g>

    <g transform="translate(242 236)">
      <rect class="blk" width="196" height="300" rx="14"/>
      <g transform="translate(10 12)">
        <text x="6" y="18" class="faint">1</text><text x="24" y="18" class="mono" fill="#e5e5e5">inbound:api</text><rect x="140" y="6" width="36" height="17" rx="5" fill="none" stroke="#2a2a2a"/><text x="148" y="18" class="muted">api</text>
        <line x1="0" y1="44" x2="176" y2="44" stroke="#222" stroke-dasharray="3 3"/>
        <text x="6" y="78" class="faint">2</text><text x="24" y="78" class="mono" fill="#e5e5e5">geoip:private</text><rect x="132" y="66" width="44" height="17" rx="5" fill="none" stroke="#ef4444" stroke-opacity=".4"/><text x="138" y="78" fill="#ef4444">block</text>
        <line x1="0" y1="104" x2="176" y2="104" stroke="#222" stroke-dasharray="3 3"/>
        <text x="6" y="138" class="faint">3</text><text x="24" y="138" class="mono" fill="#e5e5e5">category-ads</text><rect x="132" y="126" width="44" height="17" rx="5" fill="none" stroke="#ef4444" stroke-opacity=".4"/><text x="138" y="138" fill="#ef4444">block</text>
        <line x1="0" y1="164" x2="176" y2="164" stroke="#222" stroke-dasharray="3 3"/>
        <text x="6" y="198" class="faint">4</text><text x="24" y="198" class="mono" fill="#e5e5e5">geoip:ir</text><rect x="128" y="186" width="48" height="17" rx="5" fill="none" stroke="#22c55e" stroke-opacity=".4"/><text x="134" y="198" fill="#22c55e">direct</text>
        <line x1="0" y1="224" x2="176" y2="224" stroke="#222" stroke-dasharray="3 3"/>
        <text x="6" y="258" class="faint">—</text><text x="24" y="258" class="muted">all other traffic</text><rect x="128" y="246" width="48" height="17" rx="5" fill="none" stroke="#22c55e" stroke-opacity=".4"/><text x="134" y="258" fill="#22c55e">direct</text>
      </g>
    </g>

    <g transform="translate(474 290)"><rect class="blk" width="132" height="60" rx="14" stroke="#f97316" stroke-opacity=".5"/><text x="12" y="24" class="mono" fill="#f5f5f5">direct</text><text x="12" y="44" class="muted">freedom · default</text></g>
    <g transform="translate(474 410)"><rect class="blk" width="132" height="60" rx="14"/><text x="12" y="24" class="mono" fill="#f5f5f5">block</text><text x="12" y="44" class="muted">blackhole</text></g>
    <g transform="translate(474 530)" opacity=".6"><rect class="blk" width="132" height="60" rx="14"/><text x="12" y="24" class="mono" fill="#f5f5f5">api</text><text x="12" y="44" class="muted">stats only</text></g>
  </g>
  <text x="50" y="672" font-size="11" class="faint">Iran traffic and ads never leave through the server abroad.</text>

  <!-- ═══ TUNNELS ═══ -->
  <line x1="640" y1="70" x2="640" y2="700" stroke="#191919"/>
  <text x="664" y="86" font-size="12" letter-spacing="3" fill="#f97316">TUNNELS</text>
  <text x="664" y="114" font-size="22" font-weight="600" fill="#f5f5f5">Live tunnel map</text>
  <text x="664" y="138" font-size="12" class="muted">Reverse tunnels from the Iran entry to servers abroad</text>

  <g transform="translate(664 156)">
    <rect width="592" height="542" rx="22" fill="#0b0b0b" stroke="#232323"/>
    <rect width="592" height="542" rx="22" fill="url(#dots)"/>
  </g>

  <!-- hub at 1150,420 -->
  <g fill="none" stroke="#f97316" stroke-opacity=".08">
    <circle cx="1150" cy="420" r="80"/><circle cx="1150" cy="420" r="160"/><circle cx="1150" cy="420" r="250"/>
  </g>
  <circle class="sonar" cx="1150" cy="420" r="60" fill="none" stroke="#f97316" stroke-opacity=".5"/>

  <path id="tDE" class="base" d="M1150 420 Q980 240 790 270"/>
  <path class="beam" d="M1150 420 Q980 240 790 270"/>
  <path id="tFI" class="base" d="M1150 420 Q1000 600 820 580"/>
  <path class="beam slow" d="M1150 420 Q1000 600 820 580"/>
  <path class="cut" d="M1150 420 Q960 420 770 428"/>
  <g transform="translate(962 423)"><line x1="-7" y1="-7" x2="7" y2="7" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/><line x1="7" y1="-7" x2="-7" y2="7" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/></g>

  <g>
    <circle r="3.6" fill="#fbbf24"><animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#tDE" xlink:href="#tDE"/></animateMotion></circle>
    <circle r="2.6" fill="#ffffff" opacity=".8"><animateMotion dur="3.4s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#tDE" xlink:href="#tDE"/></animateMotion></circle>
    <circle r="3.6" fill="#fbbf24"><animateMotion dur="3.6s" begin="-1.2s" repeatCount="indefinite"><mpath href="#tFI" xlink:href="#tFI"/></animateMotion></circle>
    <circle r="2.6" fill="#ffffff" opacity=".8"><animateMotion dur="4.2s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#tFI" xlink:href="#tFI"/></animateMotion></circle>
  </g>

  <g text-anchor="middle">
    <g>
      <g class="orbit" style="transform-origin:790px 270px"><circle cx="790" cy="226" r="3.2" fill="#f97316"/><circle cx="836" cy="270" r="2.6" fill="#f97316"/><circle cx="758" cy="303" r="2.2" fill="#f97316"/></g>
      <circle cx="790" cy="270" r="28" fill="#141414" stroke="#f97316"/>
      <text x="790" y="275" font-size="12" font-weight="600" fill="#f5f5f5">DE</text>
      <text x="790" y="322" font-size="12" fill="#e5e5e5">germany</text><text x="790" y="337" font-size="10" class="faint">WSS · 84 ms</text>
    </g>
    <g>
      <g class="orbit rev" style="transform-origin:820px 580px"><circle cx="820" cy="540" r="2.8" fill="#f97316"/><circle cx="858" cy="580" r="2.4" fill="#f97316"/></g>
      <circle cx="820" cy="580" r="26" fill="#141414" stroke="#2e2e2e"/>
      <text x="820" y="585" font-size="12" font-weight="600" fill="#f5f5f5">FI</text>
      <text x="820" y="630" font-size="12" fill="#e5e5e5">helsinki</text><text x="820" y="645" font-size="10" class="faint">TCP mux · 97 ms</text>
    </g>
    <g>
      <circle cx="770" cy="428" r="24" fill="#141414" stroke="#ef4444" stroke-opacity=".55"/>
      <text x="770" y="433" font-size="12" font-weight="600" fill="#ef4444" class="blink">NL</text>
      <text x="770" y="472" font-size="12" fill="#e5e5e5">netherlands</text><text x="770" y="487" font-size="10" fill="#ef4444">tunnel down</text>
    </g>
    <g>
      <circle cx="1150" cy="420" r="38" fill="#141414" stroke="#f97316" stroke-opacity=".6"/>
      <text x="1150" y="426" font-size="15" font-weight="600" fill="#f5f5f5">IR</text>
      <text x="1150" y="482" font-size="12" fill="#e5e5e5">iran entry</text><text x="1150" y="497" font-size="10" class="faint">3 tunnels</text>
    </g>
  </g>

  <g font-size="11" transform="translate(688 660)">
    <line x1="0" y1="8" x2="22" y2="8" stroke="url(#beamGrad)" stroke-width="2.4"/><text x="30" y="12" class="muted">Connected</text>
    <line x1="120" y1="8" x2="142" y2="8" stroke="#ef4444" stroke-width="1.6" stroke-dasharray="4 5"/><text x="150" y="12" class="muted">Down</text>
  </g>
</svg>
