# Everything a backup subscription domain serves: subscriptions and what the
# Tifusi app calls. Never the dashboard or its API.
location /sub/ {
    proxy_pass http://panel:8000/sub/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
}
location /code/ {
    proxy_pass http://panel:8000/code/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
}
location /app/ {
    proxy_pass http://panel:8000/app/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 64k;
}
location / {
    return 404;
}
