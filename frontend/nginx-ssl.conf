server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Same compression as nginx.conf: prebuilt .gz assets plus on-the-fly API JSON.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/manifest+json;

    location /api/ {
        proxy_pass http://panel:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /sub/ {
        proxy_pass http://panel:8000/sub/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # The Android app imports a subscription by short app code from
    # /code/<code>/app.json. Without this the request falls through to
    # index.html and the app receives HTML instead of its config.
    location /code/ {
        proxy_pass http://panel:8000/code/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # The Android app POSTs connection diagnostics to /app/report. Same
    # proxy treatment as /code/ — X-Real-IP matters doubly here, since it's
    # what the backend's per-IP rate limit keys on. The body cap mirrors the
    # backend's own 64 KB limit so an oversized upload stops at nginx.
    location /app/ {
        proxy_pass http://panel:8000/app/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 64k;
    }

    # Vite content-hashes every built asset (index-<hash>.js, etc.) and
    # deletes the previous build's files outright — safe to cache these
    # forever since a changed file always gets a new name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html itself is NOT hashed and references whichever asset
    # filenames the *latest* build produced — a browser that cached this
    # from before a redeploy would go on requesting JS/CSS files that no
    # longer exist (deleted along with the old build), rendering a
    # half-broken page until a hard refresh. Every request must revalidate.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
