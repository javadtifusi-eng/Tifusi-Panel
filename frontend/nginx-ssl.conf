# Backup subscription domains (backend/app/subscription/backup_domains.py):
# one server block per domain, each with its own certificate, written by the
# panel. A single certificate listing every name would show all the backups to
# anyone who opens the live domain. The globbed include is fine when the file
# does not exist yet.
include /etc/nginx/certs/sni/servers*.conf;

# Hide the nginx version from error pages and the Server header.
server_tokens off;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    # default_server: the backup blocks included above come first in the file,
    # and without this nginx would treat the first of them as the default and
    # answer the live domain with a backup's certificate.
    listen 443 ssl default_server;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # ---- Moving the panel behind a CDN (Arvan / Cloudflare / any) --------
    # Off by default. When you point the domain at a CDN, uncomment ONE block
    # so the real visitor IP (not the CDN edge) becomes $remote_addr and
    # X-Real-IP. Device limits and the per-IP rate limiter depend on it.
    #
    # Cloudflare (real client in CF-Connecting-IP):
    #   set_real_ip_from 173.245.48.0/20;  set_real_ip_from 103.21.244.0/22;
    #   set_real_ip_from 103.22.200.0/22;  set_real_ip_from 103.31.4.0/22;
    #   set_real_ip_from 141.101.64.0/18;  set_real_ip_from 108.162.192.0/18;
    #   set_real_ip_from 190.93.240.0/20;  set_real_ip_from 188.114.96.0/20;
    #   set_real_ip_from 197.234.240.0/22; set_real_ip_from 198.41.128.0/17;
    #   set_real_ip_from 162.158.0.0/15;   set_real_ip_from 104.16.0.0/13;
    #   set_real_ip_from 104.24.0.0/14;    set_real_ip_from 172.64.0.0/13;
    #   set_real_ip_from 131.0.72.0/22;    set_real_ip_from 2400:cb00::/32;
    #   set_real_ip_from 2606:4700::/32;   set_real_ip_from 2803:f800::/32;
    #   real_ip_header CF-Connecting-IP;   real_ip_recursive on;
    #
    # ArvanCloud (real client appended to X-Forwarded-For):
    #   set_real_ip_from 185.143.232.0/22; set_real_ip_from 92.114.16.80/28;
    #   set_real_ip_from 185.215.232.0/22; set_real_ip_from 2.144.0.0/16;
    #   real_ip_header X-Forwarded-For;    real_ip_recursive on;
    # ---------------------------------------------------------------------

    # Same compression as nginx.conf: prebuilt .gz assets plus on-the-fly API JSON.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/manifest+json;

    # Baseline security headers on every response (always = even on errors).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/ {
        proxy_pass http://panel:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /sub/ {
        proxy_pass http://panel:8000/sub/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # The Android app imports a subscription by short app code from
    # /code/<code>/app.json. Without this the request falls through to
    # index.html and the app receives HTML instead of its config.
    location /code/ {
        proxy_pass http://panel:8000/code/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # The Android app POSTs connection diagnostics to /app/report. Same
    # proxy treatment as /code/ — X-Real-IP matters doubly here, since it's
    # what the backend's per-IP rate limit keys on. The body cap mirrors the
    # backend's own 64 KB limit so an oversized upload stops at nginx.
    location /app/ {
        proxy_pass http://panel:8000/app/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 64k;
    }

    # Vite content-hashes every built asset (index-<hash>.js, etc.) and
    # deletes the previous build's files outright — safe to cache these
    # forever since a changed file always gets a new name. add_header here
    # replaces the server-level ones, so nosniff is repeated.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # index.html itself is NOT hashed and references whichever asset
    # filenames the *latest* build produced — a browser that cached this
    # from before a redeploy would go on requesting JS/CSS files that no
    # longer exist (deleted along with the old build), rendering a
    # half-broken page until a hard refresh. Every request must revalidate.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
