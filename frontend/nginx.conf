server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Forward the real Host (and scheme) instead of nginx's default of the
    # upstream's own address — without this, FastAPI's request.base_url
    # (used to build subscription links when no public_url is configured)
    # would resolve to the internal "panel:8000" Docker hostname, which is
    # unreachable from outside the compose network.
    location /api/ {
        proxy_pass http://panel:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Subscription links (what client apps fetch directly, not through the
    # dashboard UI) live under /sub/, not /api/ — same proxy treatment.
    location /sub/ {
        proxy_pass http://panel:8000/sub/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Vite content-hashes every built asset (index-<hash>.js, etc.) and
    # deletes the previous build's files outright — safe to cache these
    # forever since a changed file always gets a new name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html itself is NOT hashed and references whichever asset
    # filenames the *latest* build produced — a browser that cached this
    # from before a redeploy would go on requesting JS/CSS files that no
    # longer exist (deleted along with the old build), rendering a
    # half-broken page until a hard refresh. Every request must revalidate.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
