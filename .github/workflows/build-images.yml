name: Build & publish images

# Moves the expensive part of installing Tifusi off the target server and
# onto GitHub's own (multi-core) runners. The node-agent image in
# particular compiles strongSwan from source (see backend/node_agent/
# Dockerfile) to get EAP-MSCHAPv2 support — on a small single-vCPU VPS
# that's several minutes of single-threaded compilation on every install;
# here it's a normal CI build. install.sh/install-node.sh try `docker
# pull` of these images first and only fall back to building locally if
# the pull fails (offline registry, a fork with no images published yet,
# or these packages not made Public in this repo's GitHub Packages
# settings — a one-time manual step after the first run of this workflow).
on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/build-images.yml
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: tifusi-panel-backend
            context: backend
            dockerfile: backend/Dockerfile
          - image: tifusi-panel-frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          - image: tifusi-node-agent
            context: backend
            dockerfile: backend/node_agent/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
