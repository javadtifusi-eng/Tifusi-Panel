services:
  panel:
    build: ./backend
    container_name: tifusi-panel
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      # Uncomment to run the panel with direct TLS (no reverse proxy in
      # front of it) — mount your cert/key in, then set TIFUSI_SSL_CERTFILE
      # and TIFUSI_SSL_KEYFILE to their in-container paths in .env.
      # - ./certs:/app/certs:ro
    env_file:
      - .env

  dashboard:
    build: ./frontend
    container_name: tifusi-dashboard
    restart: unless-stopped
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      # Always mounted, harmless if empty: drop fullchain.pem/privkey.pem in
      # here (install.sh's Let's Encrypt step does this for you) to serve
      # the dashboard, API and subscription links over HTTPS directly on
      # port 443. Picked up automatically at container start — no
      # nginx.conf edits or restart-time toggling needed.
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - panel
