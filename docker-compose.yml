services:
  panel:
    build: ./backend
    # Lets `docker compose pull` grab the prebuilt image (built by
    # .github/workflows/build-images.yml) instead of building locally —
    # `docker compose up -d --build` still always rebuilds from ./backend
    # regardless, for local changes. See install.sh.
    image: ${TIFUSI_PANEL_IMAGE:-ghcr.io/javadtifusi-eng/tifusi-panel-backend:latest}
    container_name: tifusi-panel
    restart: unless-stopped
    # Docker's default json-file driver keeps every line a container has ever
    # written, forever. On a busy panel that is unbounded growth on the host's
    # root filesystem, and a full disk takes down far more than the panel:
    # sshd accepts the connection but the session dies the instant PAM tries
    # to write, so the server locks you out with no way back in but a rescue
    # boot. 10MB x 3 caps each container at 30MB.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${TIFUSI_PANEL_PORT:-8000}:8000"
      # Only for Settings > SSL Certificate > "Get free SSL" — certbot's
      # standalone plugin needs to answer Let's Encrypt's HTTP-01 challenge
      # on the real port 80 itself. Harmless to leave published even if
      # that button is never used.
      - "80:80"
    volumes:
      - ./data:/app/data
      # Always mounted, shared with the dashboard container below: this is
      # where the panel writes a cert/key uploaded from Settings > SSL
      # Certificate, and (for the separate advanced "direct TLS" option,
      # see the README) where TIFUSI_SSL_CERTFILE/TIFUSI_SSL_KEYFILE point.
      - ./certs:/app/certs
    env_file:
      - .env

  dashboard:
    build: ./frontend
    image: ${TIFUSI_DASHBOARD_IMAGE:-ghcr.io/javadtifusi-eng/tifusi-panel-frontend:latest}
    container_name: tifusi-dashboard
    restart: unless-stopped
    # Docker's default json-file driver keeps every line a container has ever
    # written, forever. On a busy panel that is unbounded growth on the host's
    # root filesystem, and a full disk takes down far more than the panel:
    # sshd accepts the connection but the session dies the instant PAM tries
    # to write, so the server locks you out with no way back in but a rescue
    # boot. 10MB x 3 caps each container at 30MB.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${TIFUSI_DASHBOARD_PORT:-8080}:80"
      # 443 is what a browser assumes and what Let's Encrypt validates
      # against, so it stays the default — but it's configurable for a server
      # fronted by something that expects a different one (Cloudflare's 2053,
      # 2083, 2087, 2096, 8443). Set TIFUSI_PUBLIC_URL to match, or
      # subscription links will point at a port nothing is listening on.
      - "${TIFUSI_DASHBOARD_HTTPS_PORT:-443}:443"
    volumes:
      # Always mounted, harmless if empty: drop fullchain.pem/privkey.pem in
      # here (install.sh's Let's Encrypt step does this for you) to serve
      # the dashboard, API and subscription links over HTTPS directly on
      # port 443. Picked up automatically at container start — no
      # nginx.conf edits or restart-time toggling needed.
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - panel
