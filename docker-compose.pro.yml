# Professional edition: the panel keeps all of its data in MySQL instead of
# the built-in SQLite file. `install.sh --pro` enables it by setting
# COMPOSE_FILE=docker-compose.yml:docker-compose.pro.yml in .env, so every
# plain `docker compose` command (tifusi panel update, logs, restart) includes
# this file without extra flags. MySQL is reachable only on the compose network.
services:
  mysql:
    image: mysql:8.4
    container_name: tifusi-mysql
    restart: unless-stopped
    # Docker's default json-file driver keeps every line a container has ever
    # written, forever. On a busy panel that is unbounded growth on the host's
    # root filesystem, and a full disk takes down far more than the panel:
    # sshd accepts the connection but the session dies the instant PAM tries
    # to write, so the server locks you out with no way back in but a rescue
    # boot. 10MB x 3 caps each container at 30MB.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - --innodb-buffer-pool-size=256M
      - --performance-schema=OFF
      - --skip-name-resolve
      - --max-connections=300
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: tifusi
      MYSQL_USER: tifusi
      MYSQL_PASSWORD: ${TIFUSI_MYSQL_PASSWORD:?set by install.sh --pro}
      MYSQL_ROOT_PASSWORD: ${TIFUSI_MYSQL_ROOT_PASSWORD:?set by install.sh --pro}
    volumes:
      - ./mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 60

  panel:
    depends_on:
      mysql:
        condition: service_healthy
