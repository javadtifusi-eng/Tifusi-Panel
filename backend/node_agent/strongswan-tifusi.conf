# Charon tuning for the Tifusi node, installed to /etc/strongswan.d by the
# node Dockerfile (charon includes every file there).
charon {
    # IKE_AUTH carries the server certificate and is the handshake's largest
    # message; charon's default 1280-byte fragments are more than some mobile
    # networks pass, so keep each fragment well under that.
    fragment_size = 1000

    # Iranian mobile carriers put many phones behind one shared CGNAT address,
    # and Android retries a failed handshake within seconds. The default of 5
    # half-open IKE_SAs per IP was being hit on Hamrah-e Aval, after which
    # charon silently ignored new attempts from everyone behind that address.
    block_threshold = 20
}
